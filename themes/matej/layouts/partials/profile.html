<aside class="profile-sidebar">
    {{ with .Site.Params.profile }}
    {{ if .photo }}
    <img src="{{ .photo | relURL }}" alt="{{ .name }}" class="profile-photo">
    {{ end }}

    {{ if .name }}
    <h2 class="profile-name">{{ .name }}</h2>
    {{ end }}

    {{ if .description }}
    <p class="profile-description">{{ .description }}</p>
    {{ end }}

    {{ partial "profile-links.html" . }}
    {{ end }}
</aside>
